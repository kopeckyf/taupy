[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taupy"
version = "0.6.0"
description = "A Python package to study the theory of dialectical structures"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9,<4"
license = { text = "BSD-3-Clause" }
authors = [ { name = "Felix Kopecky" } ]

keywords = [
    "Argumentation theory",
    "Theory of dialectical structures",
    "Argumentation framework",
    "Agent-based debate model",
    "ABM"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Sociology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "sympy>=1.6.2",
    "dd>=0.5.6",
    "numpy>=1.19.4",
    "python_igraph>=0.9.6",
    "scikit_learn>=0.24.2",
    "pandas>=1.2.2",
    "more_itertools>=8.8.0",
    "z3-solver>=4.8.14.0",
]

[project.urls]
Source = "https://github.com/kopeckyf/taupy/"
"Bug Reports" = "https://github.com/kopeckyf/taupy/issues"

[tool.setuptools]
packages.find = { where = ["."], exclude = ["tests*", "test*", "documentation*"] }

license-files = ["LICENSE"]
